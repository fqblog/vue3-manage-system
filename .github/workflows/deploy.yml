name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]  # 当推送到 main 分支时触发
  workflow_dispatch:

# 设置权限
permissions:
  contents: read
  pages: write
  id-token: write

# 只允许一个并发部署
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 代码
        uses: actions/checkout@v4
      
      - name: 安装 pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10  # 你使用的 pnpm 版本
      
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # 你使用的 Node 版本
          cache: 'pnpm'
      
      - name: 安装依赖
        run: pnpm install
      
      - name: 构建项目
        run: pnpm run build  # 你的构建命令
      
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'  # 你的输出目录

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4